openapi: 3.0.0
info:
  title: SMS Dashboard API
  description: API for managing SMS modems, messages, and users.
  version: 1.0.0
servers:
  - url: /api/v1
    description: V1 API

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT or smsie API key
      description: Use `Bearer <jwt>` for dashboard sessions or `Bearer smsie_...` for API key access.

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        role:
          type: string
          enum: [admin, user]
        allowed_modems:
          type: string
          description: Comma separated ICCIDs or "*"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Modem:
      type: object
      properties:
        iccid:
          type: string
        name:
          type: string
        imei:
          type: string
        sip_enabled:
          type: boolean
        sip_username:
          type: string
        sip_proxy:
          type: string
        sip_port:
          type: integer
        sip_domain:
          type: string
        sip_transport:
          type: string
          enum: [udp, tcp, tls]
        sip_register:
          type: boolean
        sip_tls_skip_verify:
          type: boolean
        sip_accept_incoming:
          type: boolean
        sip_invite_target:
          type: string
        sip_listen_port:
          type: integer
        sip_has_password:
          type: boolean
        operator:
          type: string
        signal_strength:
          type: integer
        port_name:
          type: string
        status:
          type: string
          enum: [online, offline]
        registration:
          type: string
        last_seen:
          type: string
          format: date-time
        worker_exists:
          type: boolean
        call_supported:
          type: boolean
        sip_available:
          type: boolean
        sip_listener_active:
          type: boolean
        sip_listener_transport:
          type: string
        sip_line_id:
          type: string
        sip_register_state:
          type: string
        sip_register_reason:
          type: string
        sip_register_updated_at:
          type: string
          format: date-time

    SMS:
      type: object
      properties:
        id:
          type: integer
        iccid:
          type: string
        phone:
          type: string
        content:
          type: string
        timestamp:
          type: string
          format: date-time
        type:
          type: string
          enum: [sent, received]
        is_read:
          type: boolean
        created_at:
          type: string
          format: date-time

    CallRecording:
      type: object
      properties:
        id:
          type: integer
        iccid:
          type: string
        phone:
          type: string
        content_type:
          type: string
          enum: [audio/webm, audio/ogg, audio/mp4, audio/mpeg, audio/wav, audio/x-wav]
        size_bytes:
          type: integer
          format: int64
        duration_seconds:
          type: integer
        created_by:
          type: integer
        created_at:
          type: string
          format: date-time

    Webhook:
      type: object
      properties:
        id:
          type: integer
        iccid:
          type: string
        url:
          type: string
        platform:
          type: string
          enum: [telegram, slack, generic]
        channel_id:
          type: string
          description: "For Telegram"
        template:
          type: string
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time

    APIKeyRecord:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        name:
          type: string
        key_prefix:
          type: string
        can_make_call:
          type: boolean
        can_view_sms:
          type: boolean
        can_send_sms:
          type: boolean
        can_send_at:
          type: boolean
        is_active:
          type: boolean
        last_used_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    APIKeyCreateRequest:
      type: object
      properties:
        name:
          type: string
        can_make_call:
          type: boolean
        can_view_sms:
          type: boolean
        can_send_sms:
          type: boolean
        can_send_at:
          type: boolean
        expires_at:
          type: string
          format: date-time

    APIKeyCreateResponse:
      type: object
      properties:
        api_key:
          type: string
        record:
          $ref: "#/components/schemas/APIKeyRecord"

    ModemBay:
      type: object
      description: A physical bay in the tray. The bay is keyed by modem IMEI, not by ICCID — the SIM in the bay can change.
      properties:
        imei:
          type: string
        slot_number:
          type: integer
          nullable: true
          description: Calibrated slot number (1-32). Null if the modem has been seen but not yet calibrated.
        current_iccid:
          type: string
          description: ICCID currently in this bay, or empty if the bay is empty.
        last_seen_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    BayView:
      allOf:
        - $ref: "#/components/schemas/ModemBay"
        - type: object
          properties:
            phone_number:
              type: string
            operator:
              type: string
            balance_vnd:
              type: integer
              format: int64
            balance_updated_at:
              type: string
              format: date-time
              nullable: true
            port_name:
              type: string
            signal_strength:
              type: integer
            status:
              type: string
              enum: [online, offline, empty]
            last_event_at:
              type: string
              format: date-time
              nullable: true

    BalanceSnapshot:
      type: object
      description: One *101# balance reading, kept for the sparkline and forecast.
      properties:
        id:
          type: integer
        iccid:
          type: string
        balance_vnd:
          type: integer
          format: int64
        read_at:
          type: string
          format: date-time

    BalanceStatusItem:
      type: object
      description: A SIM evaluated against its balance threshold and recent snapshots.
      properties:
        iccid:
          type: string
        phone_number:
          type: string
        slot_number:
          type: integer
          nullable: true
        balance_vnd:
          type: integer
          format: int64
        balance_updated_at:
          type: string
          format: date-time
          nullable: true
        threshold_vnd:
          type: integer
          format: int64
        threshold_source:
          type: string
          enum: [sim, config]
          description: "sim = per-SIM low_balance_vnd override, config = balance.low_threshold_vnd default"
        days_left:
          type: number
          nullable: true
          description: Linear forecast from recent snapshots, days until balance reaches zero.
        level:
          type: string
          enum: [unknown, ok, low, forecast]
          description: unknown = no balance read yet, low = under threshold, forecast = on track to run out within balance.forecast_days
        snapshots:
          type: array
          items:
            $ref: "#/components/schemas/BalanceSnapshot"

    BalanceAlert:
      type: object
      description: One alert already sent (rate-limited to once per SIM per 24h).
      properties:
        id:
          type: integer
        iccid:
          type: string
        kind:
          type: string
          enum: [low, forecast]
        balance_vnd:
          type: integer
          format: int64
        days_left:
          type: number
          nullable: true
        sent_at:
          type: string
          format: date-time

    SimHealthItem:
      type: object
      description: A SIM evaluated against the sim_health.* thresholds (no_sms_days, unregistered_hours, absent_days).
      properties:
        iccid:
          type: string
        phone_number:
          type: string
        slot_number:
          type: integer
          nullable: true
        online:
          type: boolean
          description: Modem currently online at runtime
        last_registered_at:
          type: string
          format: date-time
          nullable: true
          description: Last time the modem reported the SIM registered on the network
        last_sms_at:
          type: string
          format: date-time
          nullable: true
          description: Last received SMS (by insertion time)
        first_seen_at:
          type: string
          format: date-time
          nullable: true
        in_bay:
          type: boolean
          description: SIM currently mapped to a physical bay
        last_removed_at:
          type: string
          format: date-time
          nullable: true
          description: Last `removed` slot event for this SIM
        findings:
          type: array
          description: Empty when the SIM looks healthy
          items:
            type: object
            properties:
              kind:
                type: string
                enum: [no_sms, unregistered, absent]
                description: no_sms = no received SMS for sim_health.no_sms_days, unregistered = online but not registered for sim_health.unregistered_hours, absent = removed from bay for sim_health.absent_days
              detail:
                type: string

    SimAlert:
      type: object
      description: One SIM health alert already sent (repeated at most every sim_health.remind_days).
      properties:
        id:
          type: integer
        iccid:
          type: string
        kind:
          type: string
          enum: [no_sms, unregistered, absent]
        detail:
          type: string
        sent_at:
          type: string
          format: date-time

    KeepaliveItem:
      type: object
      description: One SIM evaluated for keep-alive (nuôi SIM). Nothing is sent unless both keepalive.enabled (config) and enabled (per-SIM) are true.
      properties:
        iccid:
          type: string
        phone_number:
          type: string
        slot_number:
          type: integer
          nullable: true
        enabled:
          type: boolean
          description: Per-SIM opt-in (modem profile keepalive_enabled)
        interval_days:
          type: integer
          description: Effective interval — per-SIM keepalive_interval or keepalive.interval_days
        last_activity_at:
          type: string
          format: date-time
          nullable: true
          description: Last sent/received SMS on this SIM (first_seen when none)
        next_due_at:
          type: string
          format: date-time
          nullable: true
          description: last_activity_at + interval_days
        sent_this_month:
          type: integer
          description: Keep-alive SMS sent in the current calendar month (capped by keepalive.max_per_month)
        last_run:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/KeepaliveRun"
        online:
          type: boolean
          description: Modem currently online at runtime

    KeepaliveRun:
      type: object
      description: Append-only log row — one keep-alive attempt for a SIM.
      properties:
        id:
          type: integer
        iccid:
          type: string
        target_iccid:
          type: string
          description: The other SIM in the tray (same operator) that received the SMS
        target_phone:
          type: string
        status:
          type: string
          enum: [sent, failed, skipped]
          description: skipped = monthly cap reached, no target SIM, modem offline, ...
        reason:
          type: string
        ran_at:
          type: string
          format: date-time

    SimSlotEvent:
      type: object
      description: Append-only history row — a SIM (ICCID) inserted into, moved between, or removed from a bay.
      properties:
        id:
          type: integer
        detected_at:
          type: string
          format: date-time
        iccid:
          type: string
        imei:
          type: string
        phone_number:
          type: string
        operator:
          type: string
        event:
          type: string
          enum: [inserted, moved, removed]
        from_slot:
          type: integer
          nullable: true
        to_slot:
          type: integer
          nullable: true
        balance_vnd:
          type: integer
          format: int64
          nullable: true
          description: "*101# balance read right after detection, if available."
        port_name:
          type: string

security:
  - bearerAuth: []

paths:
  /login:
    post:
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Successful login
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: "#/components/schemas/User"
        "401":
          description: Invalid credentials

  /change_password:
    post:
      summary: Change Password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                old_password:
                  type: string
                new_password:
                  type: string
      responses:
        "200":
          description: Password updated

  /modems:
    get:
      summary: List all modems
      responses:
        "200":
          description: List of modems
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Modem"

  /modems/{iccid}:
    get:
      summary: Get modem detailed info
      parameters:
        - name: iccid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Modem details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Modem"
    put:
      summary: Update modem details and SIP client settings
      parameters:
        - name: iccid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                sip_enabled:
                  type: boolean
                sip_username:
                  type: string
                sip_password:
                  type: string
                  description: Leave blank to keep the current password
                sip_proxy:
                  type: string
                sip_port:
                  type: integer
                sip_domain:
                  type: string
                sip_transport:
                  type: string
                  enum: [udp, tcp, tls]
                sip_register:
                  type: boolean
                sip_tls_skip_verify:
                  type: boolean
                sip_accept_incoming:
                  type: boolean
                sip_invite_target:
                  type: string
                sip_listen_port:
                  type: integer
      responses:
        "200":
          description: Updated modem
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Modem"
    delete:
      summary: Delete modem profile by ICCID (Admin only)
      parameters:
        - name: iccid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Modem deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: deleted
                  iccid:
                    type: string

  /modems/{iccid}/scan:
    post:
      summary: Scan for available networks
      parameters:
        - name: iccid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of available networks
          content:
            application/json:
              schema:
                type: object
                properties:
                  networks:
                    type: array
                    items:
                      type: string

  /modems/{iccid}/operator:
    post:
      summary: Set network operator
      parameters:
        - name: iccid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                operator:
                  type: string
                  description: "MCCMNC code or 'AUTO'"
      responses:
        "200":
          description: Operator set initiated

  /modems/{iccid}/at:
    post:
      summary: Execute AT command directly
      tags: [Modems]
      parameters:
        - name: iccid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cmd:
                  type: string
                  example: "AT+CSQ"
                timeout:
                  type: integer
                  example: 5000
      responses:
        200:
          description: Command response
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string

  /modems/{iccid}/input:
    post:
      summary: Send raw input (e.g. for SMS prompt)
      tags: [Modems]
      parameters:
        - name: iccid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cmd:
                  type: string
                  example: "Message Body\x1A"
                timeout:
                  type: integer
                  example: 5000
      responses:
        200:
          description: Input response
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string

  /modems/{iccid}/call/state:
    get:
      summary: Get call state
      parameters:
        - name: iccid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current call state
          content:
            application/json:
              schema:
                type: object
                properties:
                  state:
                    type: string
                  reason:
                    type: string
                  updated_at:
                    type: string
                    format: date-time
                  uac_ready:
                    type: boolean
                  uac_vid:
                    type: string
                  uac_pid:
                    type: string
                  call_mode:
                    type: string
                    enum: [modem, sip]
                  sip_available:
                    type: boolean
                  sip_listener_transport:
                    type: string
                  sip_listen_port:
                    type: integer
                  sip_state:
                    type: object
                    properties:
                      state:
                        type: string
                      reason:
                        type: string
                      updated_at:
                        type: string
                        format: date-time
                      active:
                        type: boolean
                      register_state:
                        type: string
                      register_reason:
                        type: string
                      register_updated_at:
                        type: string
                        format: date-time

  /modems/{iccid}/call/dial:
    post:
      summary: Dial a number
      description: "Browser frontend uses WebRTC signaling plus modem/UAC audio and sends only `number`. Optional `via: sip` is reserved for backend/API integrations that intentionally route over the modem's SIP external line."
      parameters:
        - name: iccid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [number]
              properties:
                number:
                  type: string
                via:
                  type: string
                  enum: [modem, sip]
                  default: modem
                  description: Optional integration override. Browser UI always uses modem/WebRTC. Use `sip` only for backend/API control of the modem's SIP external line.
      responses:
        "200":
          description: Dial command accepted

  /modems/{iccid}/call/hangup:
    post:
      summary: Hangup current call
      description: Browser UI omits `via` and lets the server auto-select the active call leg. `via` remains available for explicit backend/API integrations.
      parameters:
        - name: iccid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                via:
                  type: string
                  enum: [modem, sip]
                  description: Optional integration override. If omitted, server auto-selects the active call leg.
      responses:
        "200":
          description: Hangup command accepted

  /modems/{iccid}/call/dtmf:
    post:
      summary: Send in-call DTMF tone
      description: Browser UI omits `via` and lets the server auto-select the active call leg. `via` remains available for explicit backend/API integrations.
      parameters:
        - name: iccid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tone]
              properties:
                tone:
                  type: string
                  description: one of 0-9,*,#
                  example: "5"
                via:
                  type: string
                  enum: [modem, sip]
                  description: Optional integration override. If omitted, server auto-selects the active call leg.
      responses:
        "200":
          description: DTMF sent

  /modems/{iccid}/call/recordings:
    get:
      summary: List call recordings for a modem
      parameters:
        - name: iccid
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        "200":
          description: Paginated recordings visible to the authenticated caller
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CallRecording"
                  pagination:
                    type: object
    post:
      summary: Store a completed browser call recording
      parameters:
        - name: iccid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [recording, duration_seconds]
              properties:
                recording:
                  type: string
                  format: binary
                  description: Audio recording up to 100 MB.
                phone:
                  type: string
                duration_seconds:
                  type: integer
                  minimum: 0
                  maximum: 86400
      responses:
        "201":
          description: Recording stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallRecording"

  /modems/{iccid}/call/recordings/{id}/file:
    get:
      summary: Download a call recording
      parameters:
        - name: iccid
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Recorded audio file
          content:
            audio/webm:
              schema:
                type: string
                format: binary
        "404":
          description: Recording or file not found

  /modems/{iccid}/ws:
    get:
      summary: WebRTC signaling websocket endpoint
      description: Upgrade to WebSocket and exchange SDP/ICE signaling messages.
      parameters:
        - name: iccid
          in: path
          required: true
          schema:
            type: string
      responses:
        "101":
          description: Switching Protocols

  /modems/{iccid}/profile:
    patch:
      summary: Update modem profile (Admin only)
      parameters:
        - name: iccid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                phone_number:
                  type: string
                hardware_path:
                  type: string
                balance_vnd:
                  type: integer
                  format: int64
                low_balance_vnd:
                  type: integer
                  format: int64
                  nullable: true
                  description: Per-SIM low-balance threshold override in VND. null resets to the balance.low_threshold_vnd config default.
                keepalive_enabled:
                  type: boolean
                  description: Per-SIM opt-in for keep-alive SMS. Nothing is sent unless keepalive.enabled is also true in config.yaml.
                keepalive_interval:
                  type: integer
                  minimum: 1
                  nullable: true
                  description: Per-SIM keep-alive interval in days. null resets to the keepalive.interval_days config default.
      responses:
        "200":
          description: Updated modem
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Modem"
        "400":
          description: Invalid profile data
        "404":
          description: Modem not found

  /bays:
    get:
      summary: List physical bays (khe = IMEI)
      responses:
        "200":
          description: Every bay, with the SIM currently in it (if any) and its runtime status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BayView"

  /bays/{imei}:
    patch:
      summary: Calibrate the slot number for a bay (Admin only)
      parameters:
        - name: imei
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                slot_number:
                  type: integer
                  nullable: true
                  minimum: 1
                  maximum: 32
                  description: Null clears the calibration.
      responses:
        "200":
          description: Updated bay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModemBay"
        "400":
          description: slot_number out of range
        "404":
          description: Modem bay not found
        "409":
          description: slot already assigned to another modem

  /balance/status:
    get:
      summary: Balance status for every SIM (threshold, forecast, recent snapshots)
      description: Evaluates each SIM against its threshold and recent snapshots without recording an alert. Non-admin callers only see SIMs they are allowed to view.
      responses:
        "200":
          description: One item per SIM
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BalanceStatusItem"

  /balance/alerts:
    get:
      summary: List balance alerts already sent (Admin only)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 50
            maximum: 500
      responses:
        "200":
          description: Paginated alert history, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/BalanceAlert"
                  total:
                    type: integer
                  page:
                    type: integer
                  page_size:
                    type: integer
        "403":
          description: Admin access required

  /sim-health:
    get:
      summary: SIM health for every SIM (silent / unregistered / absent from bay)
      description: Evaluates each SIM against sim_health.* thresholds without recording an alert. Non-admin callers only see SIMs they are allowed to view.
      responses:
        "200":
          description: One item per SIM; findings is empty when the SIM looks healthy
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SimHealthItem"

  /sim-health/alerts:
    get:
      summary: List SIM health alerts already sent (Admin only)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 50
            maximum: 500
      responses:
        "200":
          description: Paginated alert history, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SimAlert"
                  total:
                    type: integer
                  page:
                    type: integer
                  page_size:
                    type: integer
        "403":
          description: Admin access required

  /balance/run:
    post:
      summary: Request an immediate *101# balance read on every eligible SIM (Admin only)
      description: Requests the USSD read on eligible SIMs synchronously, then evaluates and sends alerts in the background a few seconds later.
      responses:
        "202":
          description: Accepted — number of SIMs the read was requested on
          content:
            application/json:
              schema:
                type: object
                properties:
                  requested:
                    type: integer
        "403":
          description: Admin access required

  /keepalive/status:
    get:
      summary: Keep-alive (nuôi SIM) status for every SIM
      description: Global keep-alive config plus one item per SIM (opt-in flag, effective interval, last activity, next due date, sends this month, last run). Nothing is recorded. Non-admin callers only see SIMs they are allowed to view.
      responses:
        "200":
          description: Config and one item per SIM
          content:
            application/json:
              schema:
                type: object
                properties:
                  config:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                        description: keepalive.enabled from config.yaml — when false nothing is ever sent
                      run_hour:
                        type: integer
                      interval_days:
                        type: integer
                      max_per_month:
                        type: integer
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/KeepaliveItem"

  /keepalive/runs:
    get:
      summary: List keep-alive runs (Admin only)
      parameters:
        - name: iccid
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 50
            maximum: 500
      responses:
        "200":
          description: Paginated run history, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/KeepaliveRun"
                  total:
                    type: integer
                  page:
                    type: integer
                  page_size:
                    type: integer
        "403":
          description: Admin access required

  /keepalive/run:
    post:
      summary: Send a keep-alive SMS now (Admin only)
      description: With iccid — runs that SIM synchronously, ignoring the interval but still honouring max_per_month, and returns the run. Without iccid — runs the whole tray in the background following the normal rules. Sends a PAID intra-network SMS; refused with 409 while keepalive.enabled is false.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                iccid:
                  type: string
                  description: Optional; omit to run every opted-in SIM
      responses:
        "200":
          description: Run result for the given SIM
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeepaliveRun"
        "202":
          description: Accepted — whole-tray run started in the background
          content:
            application/json:
              schema:
                type: object
                properties:
                  started:
                    type: boolean
        "400":
          description: SIM is not opted in / not eligible
        "403":
          description: Admin access required
        "404":
          description: Modem not found
        "409":
          description: keepalive.enabled is false in config.yaml

  /slot-events:
    get:
      summary: List SIM slot history (append-only)
      parameters:
        - name: iccid
          in: query
          schema:
            type: string
        - name: slot
          in: query
          schema:
            type: integer
        - name: from
          in: query
          schema:
            type: string
            format: date
          description: "YYYY-MM-DD, inclusive"
        - name: to
          in: query
          schema:
            type: string
            format: date
          description: "YYYY-MM-DD, inclusive"
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 50
            maximum: 500
      responses:
        "200":
          description: Paginated slot events. Requires admin unless filtered by an iccid the caller is allowed to view.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SimSlotEvent"
                  total:
                    type: integer
                  page:
                    type: integer
                  page_size:
                    type: integer
        "403":
          description: Admin access required to list all slot events

  /sms:
    get:
      summary: List SMS messages
      parameters:
        - name: iccid
          in: query
