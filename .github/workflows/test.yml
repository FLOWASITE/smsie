name: Test

# Chạy trên mọi PR và mỗi lần đẩy lên main. Dùng tag `nouac` (CGO tắt) nên không cần PortAudio/libusb;
# bản build đầy đủ có UAC vẫn nằm ở workflow "Build and Release".
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go vet + test
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Build
        run: go build -tags nouac ./...
      - name: Vet
        run: go vet -tags nouac ./...
      - name: Test
        run: go test -tags nouac ./...

  js:
    name: JS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test
        run: node --test web/static/js/*.test.js
