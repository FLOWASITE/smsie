# Ingress cho tunnel sms.jione (tunnel cấu hình local, dashboard không có ingress)
ingress:
  - hostname: smsie.jione.vn
    service: http://127.0.0.1:18080
  - hostname: sms.jione.vn
    service: http://127.0.0.1:18080
  # SSH vào Mac từ xa, bắt buộc đặt sau Cloudflare Access; máy khách: cloudflared access ssh
  - hostname: ssh-smsie.jione.vn
    service: ssh://localhost:22
  - service: http_status:404
